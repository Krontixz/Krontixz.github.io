name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Hello! Welcome to Krontixz's website, good job on doing your first issue"
        pr-message: "Good job on your first pull request, We will get to you soon, but thanks for your contributions!"
