<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krontixz - Bytecode Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Impact&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #0d1b2a, #1b263b, #415a77, #7f1d1d, #450a0a);
    background-size: 400% 400%;
    animation: krontixz-bg-anim 15s ease infinite;
    font-family: 'Inter', sans-serif;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
}
@keyframes krontixz-bg-anim {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.krontixz-container {
    width: 90%;
    max-width: 900px;
    margin-top: 40px;
    margin-bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
}
.krontixz-title {
    font-family: 'Impact', sans-serif;
    font-size: 3.5rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    background: linear-gradient(90deg, #38bdf8, #ef4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 25px;
    text-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
}
.krontixz-upload-box {
    border: 2px dashed #38bdf8;
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    width: 100%;
    background: rgba(30, 41, 59, 0.5);
    cursor: pointer;
    transition: all 0.3s ease;
    box-sizing: border-box;
}
.krontixz-upload-box:hover {
    border-color: #ef4444;
    background: rgba(30, 41, 59, 0.8);
}
.krontixz-upload-box pre {
    font-family: monospace;
    font-size: 0.85rem;
    color: #38bdf8;
    margin: 0 0 15px 0;
    line-height: 1.2;
}
.krontixz-hidden-form {
    display: none;
}
.krontixz-file-label {
    display: inline-block;
    background: linear-gradient(135deg, #2563eb, #dc2626);
    color: #ffffff;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}
.krontixz-file-label:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(220, 38, 38, 0.6);
}
.krontixz-actions {
    display: none;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    margin-top: 25px;
    width: 100%;
}
.krontixz-btn {
    background: #1e293b;
    border: 2px solid #38bdf8;
    color: #ffffff;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.krontixz-btn:hover {
    background: #38bdf8;
    color: #0f172a;
    border-color: #38bdf8;
}
.krontixz-btn-alt {
    border-color: #ef4444;
}
.krontixz-btn-alt:hover {
    background: #ef4444;
    border-color: #ef4444;
    color: #ffffff;
}
.krontixz-viewer-section {
    display: none;
    width: 100%;
    margin-top: 25px;
    background: #020617;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 20px;
    box-sizing: border-box;
}
.krontixz-hex-grid {
    font-family: monospace;
    font-size: 0.9rem;
    color: #38bdf8;
    white-space: pre;
    overflow-x: auto;
    max-height: 400px;
    line-height: 1.5;
}
.krontixz-editor {
    width: 100%;
    height: 350px;
    background: #0f172a;
    color: #f8fafc;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 15px;
    font-family: monospace;
    font-size: 0.95rem;
    resize: vertical;
    box-sizing: border-box;
}
.krontixz-editor-actions {
    display: flex;
    gap: 15px;
    margin-top: 15px;
}
</style>
</head>
<body>
<div class="krontixz-container">
    <h1 class="krontixz-title">Krontixz - Bytecode Viewer</h1>
    <div class="krontixz-upload-box" id="krontixz-drop-zone">
        <pre>
 UPLOAD FILES HERE
        </pre>
        <form class="krontixz-hidden-form" action="/upload-destination" method="POST" enctype="multipart/form-data">
          <label for="krontixz-file-upload">Choose a file to upload:</label>
          <input type="file" id="krontixz-file-upload" name="uploaded_file">
          <button type="submit">Submit</button>
        </form>
        <label for="krontixz-file-upload" class="krontixz-file-label">Upload your file here</label>
    </div>
    <div class="krontixz-actions" id="krontixz-action-buttons">
        <button class="krontixz-btn" id="krontixz-raw-btn">View Raw Bytecode</button>
        <button class="krontixz-btn krontixz-btn-alt" id="krontixz-decoded-btn">View Non Bytecode File</button>
    </div>
    <div class="krontixz-viewer-section" id="krontixz-raw-section">
        <div class="krontixz-hex-grid" id="krontixz-hex-output"></div>
    </div>
    <div class="krontixz-viewer-section" id="krontixz-decoded-section">
        <textarea class="krontixz-editor" id="krontixz-text-editor"></textarea>
        <div class="krontixz-editor-actions">
            <button class="krontixz-btn" id="krontixz-save-bytecode-btn">Put Back Into Bytecode</button>
            <button class="krontixz-btn krontixz-btn-alt" id="krontixz-download-btn">Download Back</button>
        </div>
    </div>
</div>
<script src="../scripts/bytecodeviewer.js"></script>
</body>
</html>
