<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Language - Repository Translation</title>
    <style>
        :root {
            --text-light: #ffffff;
            --button-bg: rgba(0, 0, 0, 0.75);
            --button-border: #ffffff;
            --button-hover-bg: #ffffff;
            --button-hover-text: #000000;
            --focus-outline: #ff9900;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            z-index: -1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-light);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, red, darkred, crimson, blue);
            z-index: -2;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        h1 {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            font-size: 1.25rem;
            opacity: 0.9;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .language-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
        }

        .lang-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            background-color: var(--button-bg);
            border: 2px solid var(--button-border);
            border-radius: 12px;
            color: var(--text-light);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(4px);
        }

        .lang-button span {
            font-size: 0.95rem;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 0.35rem;
        }

        .lang-button:hover {
            background-color: var(--button-hover-bg);
            color: var(--button-hover-text);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .lang-button:hover span {
            color: var(--button-hover-text);
            opacity: 0.9;
        }

        .lang-button:focus {
            outline: 4px solid var(--focus-outline);
            outline-offset: 4px;
        }

        .lang-button:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.25rem; }
            .language-grid { grid-template-columns: 1fr; }
            .container { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Select Your Language</h1>
            <p class="subtitle">Choose your preferred language to translate the repository docs.</p>
        </header>

        <main>
            <nav aria-label="Language selection navigation">
                <div class="language-grid" id="languageGrid"></div>
            </nav>
        </main>
    </div>

    <script>
        const languages = [
            { code: "en", name: "English", native: "English" },
            { code: "zh", name: "Chinese", native: "中文" },
            { code: "es", name: "Spanish", native: "Español" },
            { code: "hi", name: "Hindi", native: "हिन्दी" },
            { code: "ar", name: "Arabic", native: "العربية" },
            { code: "bn", name: "Bengali", native: "বাংলা" },
            { code: "pt", name: "Portuguese", native: "Português" },
            { code: "ru", name: "Russian", native: "Русский" },
            { code: "ja", name: "Japanese", native: "日本語" },
            { code: "pa", name: "Punjabi", native: "ਪੰਜਾਬੀ" },
            { code: "de", name: "German", native: "Deutsch" },
            { code: "jv", name: "Javanese", native: "Basa Jawa" },
            { code: "ms", name: "Malay", native: "Bahasa Melayu" },
            { code: "fr", name: "French", native: "Français" },
            { code: "te", name: "Telugu", native: "తెలుగు" },
            { code: "vi", name: "Vietnamese", native: "Tiếng Việt" },
            { code: "ko", name: "Korean", native: "한국어" },
            { code: "mr", name: "Marathi", native: "मराठी" },
            { code: "ta", name: "Tamil", native: "தமிழ்" },
            { code: "ur", name: "Urdu", native: "اُردُو" },
            { code: "tr", name: "Turkish", native: "Türkçe" },
            { code: "it", name: "Italian", native: "Italiano" },
            { code: "th", name: "Thai", native: "ไทย" },
            { code: "gu", name: "Gujarati", native: "ગુજરાતી" },
            { code: "fa", name: "Persian", native: "فارسی" },
            { code: "pl", name: "Polish", native: "Polski" },
            { code: "uk", name: "Ukrainian", native: "Українська" },
            { code: "nl", name: "Dutch", native: "Nederlands" },
            { code: "fil", name: "Filipino", native: "Pilipino" }
        ];

        const repoFilesMapping = {
            "en": "index.html",
            "es": "es/index.html",
            "zh": "zh/index.html"
        };

        const grid = document.getElementById('languageGrid');

        languages.forEach(lang => {
            const btn = document.createElement('button');
            btn.className = 'lang-button';
            btn.setAttribute('type', 'button');
            btn.setAttribute('aria-label', `Change page text language to ${lang.name}`);
            btn.innerHTML = `${lang.name} <span>${lang.native}</span>`;
            
            btn.addEventListener('click', () => {
                handleLanguageChange(lang.code);
            });
            
            grid.appendChild(btn);
        });

        function handleLanguageChange(langCode) {
            const destination = repoFilesMapping[langCode] || repoFilesMapping["en"];
            window.location.href = destination;
        }
    </script>
</body>
</html>
